<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Редактирование проекта</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/creater.css">
  <link rel="icon" type="image/png" href="server/icons.png" style="border-radius: 20px;">
</head>
<body>

<div id="notification" class="notification">
    <div class="notification-content">
        <span id="notification-message">Генерация JSON конфигурации</span>
        <p style="font-size: 12px; margin-top: 5px;">Вы будете перенаправлены через 5 сек.</p>
    </div>
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
</div>

<!-- Модальное окно для ввода ID -->
<div id="idModal" class="modal">
    <div class="modal-content">
        <h2>Поиск проекта</h2>
        <p>Введите ID проекта для редактирования:</p>
        <input type="text" id="projectIdInput" placeholder="например: gtehrthtbdsfbsy54gthr">
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button onclick="loadProject()" style="padding: 10px 20px; background: #ffd54f; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">Загрузить проект</button>
            <button onclick="showAllProjects()" style="padding: 10px 20px; background: #7331ff; color: white; border: none; border-radius: 10px; cursor: pointer;">Показать все проекты</button>
        </div>
        <div id="projectList" style="margin-top: 20px; max-height: 300px; overflow-y: auto; display: none;"></div>
        <p id="modalError" style="color: #ff4444; margin-top: 10px; display: none;"></p>
    </div>
</div>

<div class="container" id="editorContainer" style="display: none;">
    <h2>Редактирование проекта</h2>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <span style="color: #ffd54f;">ID: <strong id="currentId"></strong></span>
        <button onclick="location.reload()" style="padding: 8px 15px; background: #7331ff; color: white; border: none; border-radius: 8px; cursor: pointer;">Сменить проект</button>
    </div>

    <div class="form">
        <label>Название проекта:</label>
        <input type="text" id="projectName" placeholder="Название (например, Мореход Ру)">

        <label>Иконка проекта (URL):</label>
        <input type="text" id="iconPath" placeholder="https://...">
        <div id="iconPreview" class="preview-container"></div>

        <label>Тип проекта:</label>
        <select id="projectType">
            <option value="game">Игра</option>
            <option value="program">Програмное обеспечение</option>
            <option value="app">Приложение</option>
        </select>

        <label>Категории и Жанры:</label>
        <div style="position: relative;">
            <input type="text" id="cateInput" placeholder="Введите 2+ символа для поиска жанров и категорий" autocomplete="off">
            <div id="cateSuggestions" class="suggestions-list"></div>
        </div>
        <div id="cateTagsContainer" class="preview-container"></div>

        <label>Описание:</label>
        <textarea id="projectDescription" rows="4"></textarea>

        <hr>

        <label>Скриншоты проекта:</label>
        <div style="display: flex; gap: 10px;">
            <input type="url" id="screenshotInput" placeholder="Вставьте URL скриншота и нажмите Добавить">
            <button type="button" onclick="addScreenshot()" style="padding: 10px; border-radius: 10px; background: #ffd54f; border: none; cursor: pointer; font-weight: bold; color: #333;">Добавить</button>
        </div>
        <div id="screenshotsWrapper" class="preview-container" style="margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px;"></div>

        <label>Ключевые слова (через запятую):</label>
        <input type="text" id="alts">

        <label>Возрастное ограничение:</label>
        <select id="ageLimit">
            <option>0+</option>
            <option>6+</option>
            <option>10+</option>
            <option>12+</option>
            <option>16+</option>
            <option>18+</option>
        </select>

        <hr>

        <label>Версия:</label>
        <input type="text" id="version" placeholder="1.0.0">

        <label>Основной язык:</label>
        <select id="mainLang">
            <option>Русский</option>
            <option>Английский</option>
            <option>Китайский</option>
            <option>Японский</option>
        </select>

        <label>Дополнительные языки:</label>
        <div style="position: relative;">
            <input type="text" id="langInput" placeholder="Введите хотя бы 2 символа для поиска языка..." autocomplete="off">
            <div id="langSuggestions" class="suggestions-list"></div>
        </div>
        <div id="langTagsContainer" class="preview-container"></div>

        <label>Совместимые девайсы:</label>
        <div style="position: relative;">
            <input type="text" id="deviceInput" placeholder="Введите хотя бы 2 символа для поиска устройств..." autocomplete="off">
            <div id="searchSuggestions" class="suggestions-list"></div>
        </div>
        <div id="deviceTagsContainer" class="preview-container"></div>

        <label>Исходный код (URL):</label>
        <input type="url" id="sourceLink">

        <label>Отслеживаемые данные:</label>
        <div style="position: relative;">
            <input type="text" id="favaInput" placeholder="Выберите данные (локация, поиск...)" autocomplete="off">
            <div id="favaSuggestions" class="suggestions-list"></div>
        </div>
        <div id="favaTagsContainer" class="preview-container"></div>

        <hr>

        <label>Сайт разработчика:</label>
        <input type="url" id="devSite">

        <label>Техническая поддержка разработчика:</label>
        <input type="text" id="tehSupport">

        <label>Политика конфиденциальности:</label>
        <input type="text" id="polly">

        <div class="inet-control" style="margin-top: 20px; display: flex; align-items: center; gap: 15px;">
            <label style="margin: 0;">Нужен интернет?</label>
            <label class="switch">
                <input type="checkbox" id="inetToggle">
                <span class="slider round"></span>
            </label>
        </div>

        <br><br><br>
        <h2>Поле отладки и разработчика</h2>

        <label>Разработчик:</label>
        <input type="text" id="razrab">

        <label>Размер файла:</label>
        <input type="text" id="resizee">

        <label>Количество отзывов:</label>
        <input type="text" id="otzivInput">

        <label>Рейтинг (звезды):</label>
        <input type="text" id="starInput">

        <label>Текст обновления:</label>
        <textarea id="updateTextInput" rows="3"></textarea>

        <label>Дата обновления:</label>
        <input type="text" id="updatedInput" placeholder="ДД.ММ.ГГГГ">
    </div>
</div>

<div class="btn-wrapper" id="generateWrapper" style="display: none;">
    <button class="btn-main" id="generateBtn">
        <span class="btn-text">Сгенерировать обновлённую конфигурацию</span>
        <div class="btn-loader"></div>
    </button>
</div>

<script src="js/editorJson.js"></script>

<script>
document.getElementById('generateBtn').addEventListener('click', function() {
    const btn = this;
    const notification = document.getElementById('notification');
    const progressBar = document.getElementById('progress');

    btn.classList.add('is-loading');

    if (typeof buildAndCopyJSON === "function") {
        buildAndCopyJSON();
    }

    notification.classList.add('show');
    
    progressBar.style.animation = 'none';
    progressBar.offsetHeight;
    progressBar.style.animation = 'progress 5s linear forwards';

    setTimeout(function() {
        notification.classList.remove('show');
        window.location.href = 'index.html';
    }, 5000);
});
</script>

<style>
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background: #2C3E50;
    padding: 40px;
    border-radius: 20px;
    max-width: 500px;
    width: 90%;
    border: 2px solid #ffd54f;
}

.modal-content h2 {
    margin-top: 0;
}

.modal-content input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #ffd54f;
    background: #1a252f;
    color: white;
    font-size: 16px;
    margin-top: 10px;
}

.project-list-item {
    padding: 15px;
    background: #1a252f;
    margin: 10px 0;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid #444;
}

.project-list-item:hover {
    background: #7331ff;
    border-color: #ffd54f;
}

.project-list-item h3 {
    margin: 0;
    color: #ffd54f;
}

.project-list-item p {
    margin: 5px 0;
    color: #aaa;
    font-size: 12px;
}
</style>
</body>
</html>
