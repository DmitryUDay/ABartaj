<script>
    document.getElementById('categorySelect').addEventListener('change', function() {
        let selectedValue = this.value;
        let outputContainer = document.getElementById('output');
    
        switch(selectedValue) {
            case 'игры':
                outputContainer.innerHTML = '<div class="message">Hello World!</div><img class="image" src="hello-world.jpg">';
                break;
            case 'ПО':
                outputContainer.innerHTML = '<div class="message">Отображение по недоступно</div><img class="image" src="not-available.jpg">';
                break;
            default:
                outputContainer.innerHTML = '';
                break;
        }
    }) ;
    </script>
