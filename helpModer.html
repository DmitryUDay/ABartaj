<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Помощь — ABartaj</title>
    <link rel="stylesheet" href="css/helpStyle.css">

</head>
<body>
  <h1>Помощь</h1>
  <p>Оставьте свои данные для обратной связи или помощи</p>

  <form onsubmit="sendForm(event)">
    <div>
      <input type="email" id="email" name="email" placeholder="email" required>
    </div>
    <div>
      <input type="email" id="email" name="userAgent" placeholder="имя" required>
    </div>
    <div>
      <textarea id="feedback" name="feedback" placeholder="сообщение" required></textarea>
    </div>
    <div class="buttons">
        <button type="button" class="btn back-btn" onclick="history.back()">Назад</button>
      <button type="submit" class="btn submit-btn">Отправить</button>
    </div>
  </form>

  <script>
    function sendForm(e){
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const feedback = document.getElementById("feedback").value.trim();

      if(email && feedback){
        alert("Спасибо! Ваш отзыв отправлен ✅");
        e.target.reset();
      }else{
        alert("Пожалуйста, заполните все поля.");
      }
    }
  </script>
</body>
</html>
