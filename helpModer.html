<script>
    document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('inputPole');
    const sendButton = document.getElementById('getRes');

    searchInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            showAlert();
        }
    });

    // Обработчик события при клике на кнопку
    sendButton.addEventListener('click', showAlert);

    function showAlert() {
        const value = searchInput.value.trim(); // Получаем значение из инпута и убираем лишние пробелы
        if (value !== '') {
            alert(`Отправили от лица Гость вашу проблему: \n${value}`); // Выводим значение в алерт
            history.back();
        }
    }
});

document.querySelector('.gBack').addEventListener('click', function() {
this.classList.add('boni');

// Ждем окончания анимации и переходим на сайт

    history.back();
}, 500); // Время ожидания должно соответствовать длительности анимации
});
</script>
