<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Создание проекта</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="creater.css">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Создание проекта</h1>

    <div class="form">
      <label>Название проекта (до 100 символов):</label>
      <input type="text" id="projectName" maxlength="100" required>

      <label>Описание (до 500 символов):</label>
      <textarea id="projectDescription" maxlength="500" required></textarea>

      <label>Мини-описание (до 100 символов):</label>
      <input type="text" id="shortDescription" maxlength="100" required>

      <label>Иконка проекта (URL):</label>
      <input type="text" id="iconPath" placeholder="https://..." />

      <label>Скриншоты (URL через запятую):</label>
      <input type="text" id="imagePaths" placeholder="https://img1, https://img2" />

      <label>Тип проекта:</label>
      <select id="projectType" required>
        <option value="">Выберите...</option>
        <option>Бот</option>
        <option>Игра</option>
        <option>ПО</option>
        <option>Прошивка</option>
        <option>Веб приложение</option>
        <option>Сайт</option>
        <option>Исполняемый файл</option>
        <option>Плагин</option>
        <option>Приложение</option>
      </select>

      <label>Возрастное ограничение:</label>
      <select id="ageLimit" required>
        <option>0+</option>
        <option>6+</option>
        <option>12+</option>
        <option>16+</option>
        <option>18+</option>
      </select>

      <label>Разработчик:</label>
      <input type="text" value="GUst" disabled>

      <label>Основной язык:</label>
      <select id="mainLang">
        <option>Русский</option>
        <option>Английский</option>
        <option>Китайский</option>
        <option>Испанский</option>
        <option>Немецкий</option>
        <option>Французский</option>
        <option>Японский</option>
        <option>Корейский</option>
        <option>Итальянский</option>
      </select>

      <label>Версия:</label>
      <input type="text" id="version" placeholder="например 1.0.0">

      <label>Категория:</label>
      <input type="text" id="category" placeholder="например Хоррор, Бизнес и т.д.">

      <label>Ссылка на исходный код:</label>
      <input type="url" id="sourceLink" placeholder="https://...">

      <label>Ссылка на сертификат:</label>
      <input type="url" id="certificateLink" placeholder="https://...">

      <label>Сайт разработчика:</label>
      <input type="url" id="devSite" placeholder="https://...">

      <button type="submit" class="submit-btn">Создать проект</button>
    </div>

    <span id="mqttStatus">MQTT: подключение...</span>
  </div>

  <script>
    const WS_BROKER = 'wss://broker.emqx.io:8084/mqtt';
    const TOPIC_CMD = 'dmitry/commands';
    const TOPIC_RESP = 'dmitry/responses';

    const clientId = 'webclient_' + Math.random().toString(16).slice(2, 10);
    const client = mqtt.connect(WS_BROKER, { clientId, reconnectPeriod: 5000 });

    const statusEl = document.getElementById('mqttStatus');
    let pingResponse = false;

    client.on('connect', () => {
      statusEl.textContent = 'MQTT: подключен';
      client.subscribe(TOPIC_RESP);
    });

    client.on('reconnect', () => statusEl.textContent = 'MQTT: переподключение...');
    client.on('error', () => statusEl.textContent = 'MQTT: ошибка');
    client.on('offline', () => statusEl.textContent = 'MQTT: офлайн');

    client.on('message', (topic, message) => {
      const msg = message.toString();
      if (topic === TOPIC_RESP && msg === 'pong') {
        pingResponse = true;
      }
    });

    function showModal(text, time = 2000) {
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      const box = document.createElement('div');
      box.className = 'modal';
      box.textContent = text;
      bg.appendChild(box);
      document.body.appendChild(bg);
      if (time > 0) setTimeout(() => bg.remove(), time);
      return bg;
    }

    document.querySelector('.submit-btn').addEventListener('click', async (e) => {
      e.preventDefault();

      if (!client.connected) {
        alert('MQTT не подключен.');
        return;
      }

      pingResponse = false;
      client.publish(TOPIC_CMD, 'ping', { qos: 0 });
      const modal = showModal('Проверка соединения с сервером...');

      // ждём до 5 секунд
      for (let i = 0; i < 10; i++) {
        await new Promise(r => setTimeout(r, 500));
        if (pingResponse) break;
      }

      modal.remove();

      if (!pingResponse) {
        alert('Сервер не ответил. Повторите позже.');
        return;
      }

      showModal('Начинается отправка...', 1500);

      // собираем данные
      const data = [];
      const get = id => document.getElementById(id)?.value.trim();
      const push = (key, val) => { if (val) data.push(`(${key}:${val})`); };

      push('name', get('projectName'));
      push('description', get('projectDescription'));
      push('descriptionMini', get('shortDescription'));
      push('iconFile', get('iconPath'));
      push('images', get('imagePaths'));
      push('projectType', get('projectType'));
      push('age', get('ageLimit'));
      push('language', get('mainLang'));
      push('version', get('version'));
      push('kategory', get('category'));
      push('allCode', get('sourceLink'));
      push('policy', get('certificateLink'));
      push('siteDeveloper', get('devSite'));
      push('developer', 'GUst');
      push('buttonType', ['сайт', 'бот', 'веб приложение'].includes(get('projectType')?.toLowerCase()) ? 'Открыть' : 'Скачать');

      const finalString = 'LOOPA ' + data.join(' ');
      client.publish(TOPIC_CMD, finalString, { qos: 0 });
      console.log('Отправлено:', finalString);
    });
  </script>
</body>
</html>
