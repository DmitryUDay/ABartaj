<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Создание проекта</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="creater.css">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Создание проекта</h1>

    <div class="form">
      <label>Название проекта (до 100 символов):</label>
      <input type="text" id="projectName" maxlength="100" required>

      <label>Описание (до 500 символов):</label>
      <textarea id="projectDescription" maxlength="500" required></textarea>

      <label>Минимальное описание (до 100 символов):</label>
      <input type="text" id="shortDescription" maxlength="100" required>

      <label>Иконка проекта (URL):</label>
      <input type="text" id="iconPath" placeholder="https://..." />
      <div id="iconPreview" class="preview-container"></div>

      <label>Скриншоты (URL через запятую):</label>
      <input type="text" id="imagePaths" placeholder="https://img1, https://img2" />
      <div id="imagesPreview" class="preview-container"></div>

      <label>Тип проекта:</label>
      <select id="projectType" required>
        <option value="">Выберите...</option>
        <option>Бот</option>
        <option>Игра</option>
        <option>ПО</option>
        <option>Прошивка</option>
        <option>Веб приложение</option>
        <option>Сайт</option>
        <option>Исполняемый файл</option>
        <option>Плагин</option>
        <option>Приложение</option>
      </select>


      <label>Ссылка на продукт:</label>
      <input type="text" id="selfer" required>


      <label>Возрастное ограничение:</label>
      <select id="ageLimit" required>
        <option>0+</option>
        <option>6+</option>
        <option>12+</option>
        <option>16+</option>
        <option>18+</option>
      </select>

      <label>Разработчик:</label>
      <input type="text" value="GUst" disabled>

      <label>Основной язык:</label>
      <select id="mainLang">
        <option>Русский</option>
        <option>Английский</option>
        <option>Китайский</option>
        <option>Испанский</option>
        <option>Немецкий</option>
        <option>Французский</option>
        <option>Японский</option>
        <option>Корейский</option>
        <option>Итальянский</option>
      </select>

      <label>Предпочитаемые языки (выберите несколько):</label>
      <div id="preferredLangs">
        <label><input type="checkbox" value="Русский"> Русский</label>
        <label><input type="checkbox" value="Английский"> Английский</label>
        <label><input type="checkbox" value="Китайский"> Китайский</label>
        <label><input type="checkbox" value="Испанский"> Испанский</label>
        <label><input type="checkbox" value="Немецкий"> Немецкий</label>
        <label><input type="checkbox" value="Французский"> Французский</label>
        <label><input type="checkbox" value="Японский"> Японский</label>
        <label><input type="checkbox" value="Корейский"> Корейский</label>
        <label><input type="checkbox" value="Итальянский"> Итальянский</label>
      </div>

      <label>Версия:</label>
      <input type="text" id="version" placeholder="например 1.0.0">

      <label>Дата последнего обновления:</label>
      <input type="text" id="dateUPD" required>

      <label>Что обновилось?</label>
      <input type="text" id="contentUPD" required>
      
      <label>Категория:</label>
      <input type="text" id="category" placeholder="например Хоррор, Бизнес и т.д.">
      
      <label>Совместимые девайсы</label>
      <input type="text" id="deviceUDD" required>
      
      <label>По каким словам можно найти проект?</label>
      <input type="text" id="alts" required>

      <label>Ссылка на исходный код:</label>
      <input type="url" id="sourceLink" placeholder="https://...">

      <label>Ссылка на сертификат:</label>
      <input type="url" id="certificateLink" placeholder="https://...">

      <label>Сайт разработчика:</label>
      <input type="url" id="devSite" placeholder="https://...">

      <label>Категория:</label>
      <select id="projectType" required>
        <option value="">Выберите...</option>
        <option>bot</option>
        <option>game</option>
        <option>program</option>
      </select>

      <button type="submit" class="submit-btn">Создать проект</button>
    </div>

    <span id="mqttStatus">MQTT: подключение...</span>
  </div>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const TOPIC_CMD = "mytopic/cmd";
const TOPIC_RESP = "mytopic/responses";
const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt");

client.on("connect", () => {
  console.log("MQTT подключен");
  client.subscribe(TOPIC_RESP, { qos: 1 });
});

let modal;

function showModal(text, showButton = false) {
  modal = document.createElement("div");
  modal.className = "modal-bg";
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<p>${text}</p>`;

  if(showButton){
    const btn = document.createElement("button");
    btn.textContent = "OK";
    btn.onclick = () => window.location.href = "index.html";
    box.appendChild(btn);
  }

  modal.appendChild(box);
  document.body.appendChild(modal);
}

function closeModal() {
  if(modal) modal.remove();
  modal = null;
}
function getPreferredLanguages() {
  const checkboxes = document.querySelectorAll('#preferredLangs input[type="checkbox"]');
  const selected = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
  return selected;
}


document.querySelector('.submit-btn').addEventListener('click', (e) => {
  e.preventDefault();

  const get = id => document.getElementById(id)?.value.trim();

  const selectedLangs = getPreferredLanguages();
  const project = {
    name: get('projectName'),
    description: get('projectDescription'),
    descriptionMini: get('shortDescription'),
    icon: get('iconPath'),
    imgScreen: get('imagePaths'),
    projectType: get('projectType'),
    age: get('ageLimit'),
    language: get('mainLang'),
    version: get('version'),
    kategory: get('category'),
    allCode: get('sourceLink'),
    policy: get('certificateLink'),
    siteDeveloper: get('devSite'),
    content: get('selfer'),
    updated: get('dateUPD'),
    updateText: get('contentUPD'),
    deviceTy: get('deviceUDD'),
    alternatives: get('alts'),
    developer: 'GUst',
    sertificate: 'Да',
    size: 'Онлайн',
    fava: '',
    anonsy: '',
    languageKalivan: `+${selectedLangs.length} других`,
    otziv: '0',
    star: '0',
    buttonType: ['сайт','бот','веб приложение'].includes(get('projectType')?.toLowerCase()) ? 'Открыть' : 'Скачать'
  };

  const message = "appendProject::" + JSON.stringify(project);

  // Публикуем на MQTT
  client.publish(TOPIC_CMD, message, { qos: 1 });

  // Модалка появляется сразу, не ждём ответа
  showModal("Подождите, загружаю на сервер…");
});

// Дополнительно: если Python ответит, можно обработать
client.on("message", (topic, message) => {
  if(topic === TOPIC_RESP && message.toString() === "doneUPDOW"){
    closeModal();
    showModal("Всё готово!", true);
  }
});
</script>





<script>
  const iconInput = document.getElementById('iconPath');
const iconPreview = document.getElementById('iconPreview');

const imagesInput = document.getElementById('imagePaths');
const imagesPreview = document.getElementById('imagesPreview');

function createPreview(url, container, single = false) {
  if (!url) return;

  if (single) container.innerHTML = ''; // только одна иконка

  const wrapper = document.createElement('div');
  wrapper.className = 'img-wrapper';

  const img = document.createElement('img');
  img.src = url;
  wrapper.appendChild(img);

  const btn = document.createElement('button');
  btn.textContent = '×';
  btn.className = 'delete-btn';
  btn.onclick = () => {
    wrapper.remove();
    if (single) container.querySelectorAll('img').length === 0 && (iconInput.value = '');
    else {
      const urls = Array.from(container.querySelectorAll('img')).map(i => i.src);
      imagesInput.value = urls.join(',');
    }
    if(single) iconInput.value = '';
  };
  wrapper.appendChild(btn);

  container.appendChild(wrapper);
}

// Иконка
iconInput.addEventListener('change', () => {
  const url = iconInput.value.trim();
  if (!url) return;
  createPreview(url, iconPreview, true);
});

// Скриншоты
imagesInput.addEventListener('change', () => {
  const urls = imagesInput.value.split(',').map(u => u.trim()).filter(u => u);
  imagesPreview.innerHTML = ''; // очистка
  urls.slice(0, 10).forEach(url => createPreview(url, imagesPreview, false));
});
</script>


</body>
</html>
