<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Win8 Tile Animation</title>
    <style>
        /* Базовые стили для фона */
        body {
            background-color: #0078d7; /* Тот самый синий Win8 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            perspective: 1000px; /* Важно для 3D эффекта */
            overflow: hidden;
        }

        /* Наша плитка */
        .tile {
            width: 150px;
            height: 150px;
            background-color: #2d2d2d;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1;
        }

        /* Эффект легкого нажатия */
        .tile:active {
            transform: scale(0.95);
        }

        /* Класс анимации открытия */
        .tile.opening {
            position: fixed;
            pointer-events: none; /* Чтобы нельзя было кликнуть в полете */
            animation: win8-open 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 999;
        }

        /* Магия анимации */
        @keyframes win8-open {
            0% {
                transform: translate(0, 0) rotateY(0deg) scale(1);
                left: var(--start-x);
                top: var(--start-y);
            }
            100% {
                /* Прыжок в центр, поворот на 360 и расширение */
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) rotateY(360deg) scale(10);
            }
        }



        .mondal{
            display: none;
            width: 100%;
            height: 100%;
            background-color: #2d2d2d;
            color: white;
        }

    </style>
</head>


<div class="mondal" id="masa">
    <h1>привет дурак</h1>
</div>



<body>

    <div class="tile" id="myTile">
        <span>Проект</span>
    </div>

    <script>
        const tile = document.getElementById('myTile');

        tile.addEventListener('click', (e) => {
            const rect = tile.getBoundingClientRect();
            tile.style.setProperty('--start-x', rect.left + 'px');
            tile.style.setProperty('--start-y', rect.top + 'px');

            tile.classList.add('opening');
        });

        // Слушаем окончание анимации
        tile.addEventListener('animationend', (e) => {
            // Проверяем, что закончилась именно нужная нам анимация
            if (e.animationName === 'win8-open') {
                tile.style.display = "none";
                
                // --- ВОТ ТУТ ПИШИ СВОЙ КОД ---
                const btnObj2 = document.getElementById("masa");
                btnObj2.style.display = "block";
                
                // Если нужно убрать класс после завершения:
                // tile.classList.remove('opening');
            }
        });


    </script>
</body>
</html>
